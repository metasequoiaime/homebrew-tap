name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  style:
    # The casks are written by metasequoiaime/msime's release-macos.yml from platforms/macos/homebrew/msime.rb.in; a failure here usually means that template needs the same fix.
    name: Cask style
    runs-on: depot-macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every cask with Homebrew's style rules
        run: brew style Casks/*.rb
